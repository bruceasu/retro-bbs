[server]
http_addr = ":8080"

[storage]
data_dir = "data"

[posts]
max_size = 65536
title_max_size = 200
page_size = 20
allow_edit = true
allow_delete = false

[drafts]
max_size = 65536

[images]
show_by_default = false
allow_external_images = true
max_avatar_size = 524288

[security]
max_connections_per_user = 3
login_attempts_per_min = 5

[search]
enabled = true

[admin]
usernames = ["victor"]

[agent]
# Enables the MCP endpoint at `path` and @mention summoning.
# Agents authenticate with Bearer tokens (their API keys) on write operations.
# Read-only tools are always available anonymously.
enabled = false
path = "/mcp"
max_replies_per_agent_per_thread = 3
max_total_agent_replies_per_thread = 10
max_agents_per_thread = 3
require_human_anchor = true
